name: Mustapha Kokumo
role: PhD Researcher in Economics
institution: European University Institute
institution_url: https://www.eui.eu/DepartmentsAndCentres/Economics
city: Florence

# Small green line above your name.
eyebrow: Applied microeconomics

# One or two sentences. Google shows this under your name in search
# results, and WhatsApp/LinkedIn show it when the link is shared.
description: >-
  Mustapha Kokumo is a PhD researcher in economics at the European
  University Institute in Florence. He studies migration, refugee
  integration and labour markets.

email: mustapha.kokumo@eui.eu
address:
  - European University Institute
  - Via delle Fontanelle 18
  - Fiesole, Italy

# Upload the files to the assets folder with exactly these names.
# Until a file exists, the site hides the CV links / shows your initials.
cv: /assets/Mustapha_Kokumo_CV.pdf
photo: /assets/photo.jpg

# Research interests shown under your bio, one per line.
fields:
  - Applied Microeconomics
  - Economics of Migration
  - Labour Economics
  - Political Economy
  - Cultural Economics

# Profiles. Paste a link after "url:" to show it; leave it empty to hide.
# These also tell Google that these profiles are you.
